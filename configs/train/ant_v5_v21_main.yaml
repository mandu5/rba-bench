name: ant_v5_v21_main
adaptation_policy: budgeted-td
output_dir: results
tags:
  - v2.1
  - phase-c
  - main
  - ant-v5
  - repeated-mild-drift
  - budgeted-replay-allocation

train:
  algo: sac
  env_id: Ant-v5
  seed: 51
  total_steps: 150000
  pretrain_steps: 60000
  device: cpu
  log_interval: 5000
  eval_window: 10

drift:
  shift_type: friction
  shift_step: 8000
  severity: 0.15
  repeat_interval: 8000
  repeat_count: 4

budget:
  window_steps: 2500
  max_updates_per_window: 1250
  recent_replay_ratio: 0.5

eval:
  eval_episodes: 3
  eval_interval_steps: 2500
  deterministic: true
  eval_seed_offset: 10000

cost:
  include_update_count: true
  include_replay_samples: true
  include_wallclock_update_time: true
  include_reward_ctrl: true
  budget_score_update_penalty: 0.05

model:
  hidden_sizes: [256, 256]
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha: 0.2
  autotune: true
  batch_size: 256
  buffer_size: 250000
  recent_buffer_size: 35000
  learning_starts: 5000
  policy_frequency: 2
  target_network_frequency: 1

env_kwargs: {}
