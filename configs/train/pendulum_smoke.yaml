name: pendulum_smoke
adaptation_policy: fixedadapt
output_dir: results
tags:
  - smoke
  - pendulum
  - external-env

train:
  algo: sac
  env_id: Pendulum-v1
  seed: 11
  total_steps: 12000
  pretrain_steps: 5000
  device: cpu
  log_interval: 1000
  eval_window: 5

drift:
  shift_type: actuator_gain
  shift_step: 1500
  severity: 0.20
  repeat_interval: 0
  repeat_count: 1

budget:
  window_steps: 500
  max_updates_per_window: 300
  recent_replay_ratio: 0.5

model:
  hidden_sizes: [256, 256]
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha: 0.2
  autotune: true
  batch_size: 128
  buffer_size: 50000
  recent_buffer_size: 10000
  learning_starts: 1000
  policy_frequency: 2
  target_network_frequency: 1

env_kwargs: {}
