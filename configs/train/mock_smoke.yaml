name: mock_smoke
adaptation_policy: proposed
output_dir: results
tags:
  - smoke
  - mock
  - proposed

train:
  algo: sac
  env_id: MockContinuousControl-v0
  seed: 7
  total_steps: 3000
  pretrain_steps: 1200
  device: cpu
  log_interval: 200
  eval_window: 5

drift:
  shift_type: actuator_gain
  shift_step: 600
  severity: 0.25
  repeat_interval: 0
  repeat_count: 1

budget:
  window_steps: 200
  max_updates_per_window: 120
  recent_replay_ratio: 0.5

model:
  hidden_sizes: [128, 128]
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha: 0.2
  autotune: true
  batch_size: 64
  buffer_size: 20000
  recent_buffer_size: 4000
  learning_starts: 128
  policy_frequency: 2
  target_network_frequency: 1

env_kwargs:
  episode_length: 200
  dt: 0.05
  target: 0.0
