name: utility_proxy_ablation
adaptation_policy: budgeted-td
output_dir: results
tags:
  - v2.1
  - ablation
  - utility-proxy
  - hopper-v5

# Use this config with `sweep-policies` and the policy list:
#   uniform per budgeted-td budgeted-grad budgeted-novelty
# All baselines share the same total update budget B (controlled by
# `budget.max_updates_per_window` and the deploy-phase length).

train:
  algo: sac
  env_id: Hopper-v5
  seed: 41
  total_steps: 80000
  pretrain_steps: 40000
  device: cpu
  log_interval: 5000
  eval_window: 10

drift:
  shift_type: body_mass
  shift_step: 5000
  severity: 0.30
  repeat_interval: 0
  repeat_count: 1

budget:
  window_steps: 2000
  max_updates_per_window: 800
  recent_replay_ratio: 0.5

eval:
  eval_episodes: 3
  eval_interval_steps: 2000
  deterministic: true
  eval_seed_offset: 10000

cost:
  include_update_count: true
  include_replay_samples: true
  include_wallclock_update_time: true
  include_reward_ctrl: true
  budget_score_update_penalty: 0.05

model:
  hidden_sizes: [256, 256]
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha: 0.2
  autotune: true
  batch_size: 256
  buffer_size: 200000
  recent_buffer_size: 30000
  learning_starts: 5000
  policy_frequency: 2
  target_network_frequency: 1

env_kwargs: {}
